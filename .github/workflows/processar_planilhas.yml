name: Processar Novas Planilhas

on:
  push:
    paths:
      - 'dados_brutos/**.xlsx' # O robô só acorda se cair um Excel dentro dessa pasta

jobs:
  atualizar_base:
    runs-on: ubuntu-latest
    
    # Dá permissão para o robô salvar o CSV final de volta no repositório
    permissions:
      contents: write

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requisitos.txt

      - name: Executar script de consolidação
        run: python consolidar_vendas.py

      - name: Salvar CSV e limpar o GitHub
        run: |
          git config --global user.name "GitHub Actions - Bot"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "Auto: Base consolidada atualizada e brutos removidos" || echo "Nenhuma mudança para salvar"
          git push
